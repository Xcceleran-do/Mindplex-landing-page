<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#12161d" />

		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/Geist-Variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		<!-- Marks that scripting is available, before first paint. Scroll-reveal
		     styles are scoped to .js so content stays visible without it. -->
		<script>
			document.documentElement.classList.add('js');
		</script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
