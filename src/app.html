<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#15181f" />

		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/Newsreader-Variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/SchibstedGrotesk-Variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		<!-- Scroll-reveal styles are scoped to .js so content stays visible without it. -->
		<script>
			document.documentElement.classList.add('js');
		</script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
